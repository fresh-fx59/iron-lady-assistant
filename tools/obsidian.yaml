name: obsidian
description: Work with Obsidian vaults (plain Markdown notes) and automate via obsidian-cli.
tier: core
triggers:
- obsidian
- work
- with
- obsidian
- vaults
- (plain
instructions: "# Obsidian (headless server)\n\nThe vault is plain Markdown files on disk. Get its path:\n  VAULT=$(obsidian-cli print-default --path-only)\n\nIMPORTANT: this is a HEADLESS server with NO Obsidian desktop, so obsidian-cli\ncommands that open notes via the obsidian:// URI do NOT work here (search,\nsearch-content, open, daily, create --open). Use plain file tools instead:\n\n- Find by\
  \ name:    find \"$VAULT\" -type f -iname '*TERM*'\n- Find by content: rg -l -i 'TERM' \"$VAULT\"   (then cat the match)\n- Read a note:     cat \"$VAULT/Folder/Note.md\"\n- Create/edit:     write the .md file directly (mkdir -p the folder first)\n- Rename/move (updates [[wikilinks]] across the vault): obsidian-cli move \"old/path\" \"new/path\"\n- List structure:  find \"$VAULT\" -maxdepth 2 -type\
  \ d\n\nNotes live in folders (e.g. Projects/). Match loosely: a request like '2026 Europe note'\nmay be a file named 'Eurotrip 2026 May.md' - search by keyword, do not require an exact name.\nThe vault config dir .obsidian/ is settings; do not edit it.\nA convenience symlink also exists at ./Obsidian inside the working directory."
setup: 'Ensure binary installed: obsidian-cli'
